name: GeoQuiz
options:
  bundleIdPrefix: com.geoquiz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  GeoQuiz:
    type: application
    platform: iOS
    sources:
      - path: GeoQuiz
    info:
      path: Generated-Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geoquiz.app
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme: {}
  GeoQuizTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GeoQuizTests
    dependencies:
      - target: GeoQuiz
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GeoQuiz:
    build:
      targets:
        GeoQuiz: all
        GeoQuizTests: [test]
    test:
      targets:
        - GeoQuizTests
    run:
      config: Debug
